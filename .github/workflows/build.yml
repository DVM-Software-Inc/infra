name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      environment:
        required: true
        type: string
      context:
        required: false
        type: string
        default: "."
        description: Docker build context, relative to the caller repository root.
      dockerfile:
        required: false
        type: string
        default: Dockerfile
        description: Dockerfile path, relative to the caller repository root.
      build_args:
        required: false
        type: string
        default: ""
        description: Optional newline-delimited Docker build arguments.
      cache_scope:
        required: false
        type: string
        default: ""
        description: Optional GitHub Actions cache scope; defaults to the image name.
      publish_moving_tag:
        required: false
        type: boolean
        default: true
        description: Also publish the mutable :<environment> compatibility tag.
    outputs:
      image_tag:
        description: Immutable tag in <environment>-<shortsha> form.
        value: ${{ jobs.build.outputs.image_tag }}
      image_ref:
        description: Fully qualified immutable image reference.
        value: ${{ jobs.build.outputs.image_ref }}
      digest:
        description: OCI image digest returned by Buildx.
        value: ${{ jobs.build.outputs.digest }}
    secrets:
      GHCR_USERNAME:
        required: false
        description: Deprecated compatibility input; defaults to github.actor.
      GHCR_TOKEN:
        required: false
        description: Deprecated compatibility input; defaults to github.token.
      GIT_AUTH_TOKEN:
        required: false
        description: Optional token exposed only as a BuildKit secret for private Git dependencies.

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_ref: ${{ steps.meta.outputs.image_ref }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Resolve immutable image metadata
        id: meta
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          PUBLISH_MOVING_TAG: ${{ inputs.publish_moving_tag }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::7}"
          image_tag="${DEPLOY_ENVIRONMENT}-${short_sha}"
          image_ref="ghcr.io/${owner}/${image}:${image_tag}"

          {
            echo "image_tag=$image_tag"
            echo "image_ref=$image_ref"
            echo "tags<<EOF"
            if [ "$PUBLISH_MOVING_TAG" = "true" ]; then
              echo "ghcr.io/${owner}/${image}:${DEPLOY_ENVIRONMENT}"
            fi
            echo "$image_ref"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: ${{ inputs.build_args }}
          secrets: |
            GIT_AUTH_TOKEN=${{ secrets.GIT_AUTH_TOKEN }}
          cache-from: type=gha,scope=${{ inputs.cache_scope || inputs.image_name }}-${{ inputs.environment }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope || inputs.image_name }}-${{ inputs.environment }}
