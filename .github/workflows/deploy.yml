name: Reusable VPS Deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      compose_file:
        type: string
        required: true
        description: Repo-relative path to the compose file, e.g. deploy/docker-compose.dev.yml
      deploy_path:
        type: string
        required: true
        description: Absolute directory on the VPS, e.g. /opt/audition-parse/dev
    secrets:
      GHCR_USERNAME:
        required: true
      GHCR_TOKEN:
        required: true
      VPS_HOST:
        required: true
      VPS_USER:
        required: true
      VPS_SSH_KEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Validate compose_file path
        run: |
          case "${{ inputs.compose_file }}" in
            deploy/*.yml|deploy/*.yaml) ;;
            *) echo "compose_file must be deploy/<file>.yml (scp strip_components contract)"; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ${{ inputs.compose_file }}
          target: ${{ inputs.deploy_path }}
          strip_components: 1

      - name: Pull image and restart stack
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ inputs.deploy_path }}"
            COMPOSE_FILE="$(basename "${{ inputs.compose_file }}")"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            trap 'docker logout ghcr.io' EXIT
            docker compose -f "$COMPOSE_FILE" pull
            docker compose -f "$COMPOSE_FILE" up -d --remove-orphans
            docker compose -f "$COMPOSE_FILE" ps
