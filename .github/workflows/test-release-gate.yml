name: Release gate checks
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release-gate-tests-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -m unittest discover -s tests -p 'test_release_gate.py' -v
      - run: python3 -m py_compile release_gate/gate.py release_gate/install.py
