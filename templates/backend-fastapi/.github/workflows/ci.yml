# Canonical caller for the infra reusable workflows — see infra prompts/base.md.
# main → dev auto-deploy; prod only via manual workflow_dispatch (protected environment).
name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, prod]
        default: dev
        required: true

jobs:
  # add lint/test jobs here and make `build` depend on them

  build:
    uses: DVM-Software-Inc/infra/.github/workflows/build.yml@main
    permissions:
      contents: read
      packages: write
    with:
      image_name: ${{ github.event.repository.name }}
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}

  deploy:
    needs: build
    uses: DVM-Software-Inc/infra/.github/workflows/deploy.yml@main
    permissions:
      contents: read
      packages: read
    with:
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
      compose_file: deploy/docker-compose.yml
      deploy_path: /opt/apps/${{ github.event.repository.name }}/${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
      image_tag: ${{ needs.build.outputs.image_tag }}
      require_env_file: true
      # migrate_command: docker compose -f "$COMPOSE_FILE" run --rm api alembic upgrade head
    # MUST be `inherit`, not an explicit list — an explicit secrets: block is evaluated
    # in the caller's context (no environment), so the per-environment ENV_FILE secret
    # arrives empty and require_env_file fails (base.md; bit talk2me 2026-07-18).
    secrets: inherit
