name: Python Backend CI/CD

on:
  push:
    branches: [dev, main]

jobs:
  build:
    uses: DVM-Software-Inc/infra/.github/workflows/build.yml@main
    with:
      image_name: ${{ github.event.repository.name }}
      environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    secrets:
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  deploy:
    needs: build
    uses: DVM-Software-Inc/infra/.github/workflows/deploy.yml@main
    with:
      environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      compose_file: deploy/docker-compose.yml
      deploy_path: /opt/${{ github.event.repository.name }}/${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    secrets:
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
